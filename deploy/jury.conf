server {
    listen 8080;
    server_tokens off;
    # FastAPI enforces the 16 MiB file limit after the multipart envelope.
    client_max_body_size 17m;

    location = /materialy/ { root /srv; index index.html; }
    location ~ ^/materialy/(index\.html|film\.mp4|opis-projektu\.pdf|prezentacja\.pdf|kod\.zip|przyklad-analizy\.json)$ {
        root /srv;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /materialy/risk-miner.git/ {
        root /srv;
        add_header Cache-Control "no-cache" always;
    }

    location /materialy/ {
        root /srv;
        index index.html;
        auth_basic "Risk Miner - materialy jury";
        auth_basic_user_file /etc/nginx/jury.htpasswd;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream http://app:8080;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }
}
