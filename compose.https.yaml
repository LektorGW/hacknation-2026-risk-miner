services:
  app:
    ports: !reset []
    env_file: !override
      - ${RISKMINER_CONFIG_FILE:-.env}
    environment:
      RISKMINER_HOSTS: "127.0.0.1,localhost,${RISKMINER_DOMAIN:?Ustaw nazwe domeny serwera}"
  https:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      RISKMINER_DOMAIN: ${RISKMINER_DOMAIN:?Ustaw nazwe domeny serwera}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${RISKMINER_HTTP_BIND:-80}:80"
      - "${RISKMINER_HTTPS_BIND:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certyfikaty:/data
      - konfiguracja-proxy:/config
    restart: unless-stopped
volumes:
  certyfikaty:
  konfiguracja-proxy:
