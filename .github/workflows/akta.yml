name: Publiczne akta umów
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akta.yml'
      - 'scripts/build_showcase.py'
      - 'riskminer/**'
      - 'fixtures/real/cases.json'
      - 'static/dossier.css'
      - 'static/assets/znak.svg'
      - 'static/assets/oczyszczalnia.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m scripts.build_showcase dist/akta
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/akta
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
