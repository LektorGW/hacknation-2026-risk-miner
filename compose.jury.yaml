name: riskminer-jury
services:
  app:
    build: .
    env_file: ./var/dostep-jury/app.env
    volumes:
      - dane-jury:/data
      - ./var/dostep-jury/baseline:/baseline:ro
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=192m,mode=1777
  gateway:
    image: nginx:stable-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    depends_on: [app]
    volumes:
      - ./deploy/jury.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var/dostep-jury/htpasswd:/etc/nginx/jury.htpasswd:ro
      - ./var/dostep-jury/materialy:/srv/materialy:ro
    ports:
      - "127.0.0.1:8181:8080"
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    command: tunnel --no-autoupdate --protocol http2 --url http://gateway:8080
    depends_on: [gateway]
    restart: unless-stopped
volumes:
  dane-jury:
