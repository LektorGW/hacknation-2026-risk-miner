services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - dane:/data
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
volumes:
  dane:
