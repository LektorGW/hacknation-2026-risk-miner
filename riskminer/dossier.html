<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${place} · Akta umowy · Risk Miner</title><link rel="icon" href="/static/assets/znak.svg"><link rel="stylesheet" href="/static/dossier.css"></head>
<body><header><span class="brand"><img src="/static/assets/znak.svg" alt="">Risk Miner</span><span>Akta umowy</span></header>
